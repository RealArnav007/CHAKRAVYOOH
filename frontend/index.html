<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUKAAR — National Disaster Operations Command Portal</title>
  <meta name="theme-color" content="#060911">
  <meta name="description" content="National Emergency Operations Command Center — Offline Mesh SOS Relay & Real-Time Official Dispatch Portal">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#060911',
              card: '#0d121f',
              hover: '#131b2d',
              border: '#1a243b'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
            heading: ['Outfit', 'Space Grotesk', 'Plus Jakarta Sans', 'sans-serif'],
            brand: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { background-color: #060911; color: #f1f5f9; font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.015em; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #060911; }
    ::-webkit-scrollbar-thumb { background: #1a243b; border-radius: 9999px; }

    /* Keyframe Glow strictly for Critical Red Alert bar */
    @keyframes glowPulseRed {
      0%, 100% {
        box-shadow: 0 0 18px rgba(244, 63, 94, 0.5), inset 0 0 14px rgba(244, 63, 94, 0.2);
        border-color: rgba(244, 63, 94, 0.8);
      }
      50% {
        box-shadow: 0 0 36px rgba(244, 63, 94, 0.95), inset 0 0 24px rgba(244, 63, 94, 0.4);
        border-color: rgba(244, 63, 94, 1);
      }
    }

    @keyframes beaconPing {
      0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 4px currentColor; }
      50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 18px currentColor; }
      100% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 4px currentColor; }
    }

    @keyframes scanSweep {
      0% { transform: translateY(-100%); opacity: 0; }
      40% { opacity: 0.75; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-24px) translateX(15px); opacity: 0.85; }
    }

    .glow-alert-red {
      animation: glowPulseRed 2s infinite ease-in-out;
    }

    .beacon-dot-red {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background-color: #f43f5e;
      color: #f43f5e;
      animation: beaconPing 1.2s infinite ease-in-out;
    }

    /* Very dull, subtle background grid */
    .dull-grid-pattern {
      background-color: #060911;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        radial-gradient(circle at 50% 35%, rgba(244, 63, 94, 0.1) 0%, rgba(6, 9, 17, 0.98) 75%);
      background-size: 50px 50px, 50px 50px, 100% 100%;
    }

    /* Sweeping vertical radar beam */
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: linear-gradient(to bottom, transparent, rgba(244, 63, 94, 0.25), rgba(6, 182, 212, 0.15), transparent);
      animation: scanSweep 7s ease-in-out infinite;
      pointer-events: none;
    }

    .glass-card {
      background: rgba(13, 18, 31, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body class="antialiased min-h-screen">
  <div id="app"></div>

  <script>
    // ── Pukar Backend Config ─────────────────────────────────────────────────
    // Same-origin: FastAPI serves this HTML at port 8000, so all fetch()
    // calls use relative paths. WS uses the same host automatically.
    const WS_PROTO = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const WS_BASE  = `${WS_PROTO}//${location.host}`;

    // Backend RoleEnum → human-readable display label
    const ROLE_DISPLAY = {
      'SUPER_ADMIN': 'ADMIN', 'COMMANDER': 'COMMANDER',
      'RESPONDER': 'OFFICER', 'ANALYST': 'ANALYST', 'VIEWER': 'VIEWER',
    };

    // ── Auth Tokens (in-memory only — NOT localStorage) ──────────────────────
    let accessToken  = null;
    let refreshToken = null;
    let sessionId    = null;
    let wsConn       = null;

    // --- Application State ---
    let state = {
      isAuthenticated: false,
      role: 'VIEWER',
      roleDisplay: 'VIEWER',
      badge: '',
      officerName: '',
      otpEmail: '',
      showOTPInput: false,
      authPage: 'signin',       // 'signin' | 'register'
      loginMethod: 'password',  // 'password' | 'otp'
      activeTab: 'dashboard',
      selectedIncidentId: null,
      lastSyncTime: new Date().toLocaleTimeString(),
      apiStatus: 'CONNECTING',
      showIngestModal: false,
      rawPacketJson: JSON.stringify({
        sos_id: `INC-${Math.floor(100 + Math.random() * 900)}`,
        lat: 28.6139, lon: 77.2090,
        severity: "CRITICAL",
        payload: { victim_count: 4, hazard: "Building Structural Collapse", message: "Emergency trapped victim report!" }
      }, null, 2),
      incidents: [],
      resources: [
        { id: 'res-01', callsign: 'NDRF Heavy Rescue-03',      type: 'RESCUE',    status: 'AVAILABLE', etaMinutes: 0 },
        { id: 'res-02', callsign: 'Delhi Fire Foam Engine-12',  type: 'FIRE',      status: 'AVAILABLE', etaMinutes: 0 },
        { id: 'res-03', callsign: 'AIIMS ALS Ambulance-07',     type: 'AMBULANCE', status: 'AVAILABLE', etaMinutes: 0 }
      ],
      auditEvents: [
        { id: 'aud-1', timestamp: new Date().toLocaleTimeString(), userName: 'System', role: 'SYSTEM', action: 'PORTAL_INITIALIZED', resourceName: 'Pukar Command Backend v4', result: 'ONLINE' }
      ]
    };

    // --- State Management Helpers ---
    function setState(updater) {
      if (typeof updater === 'function') {
        state = updater(state);
      } else {
        state = { ...state, ...updater };
      }
      renderApp();
    }

    // ── Step 1: Request OTP → backend emails the code ─────────────────────────
    async function requestOTP() {
      const email = (document.getElementById('signinEmail') || document.getElementById('adminEmail'))?.value?.trim();
      if (!email || !email.includes('@')) { alert('Enter a valid official email address.'); return; }
      try {
        const res = await fetch('/api/v1/auth/otp/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        if (!res.ok) { const e = await res.json().catch(()=>({})); alert(e.detail || 'OTP service unavailable.'); return; }
        setState(s => ({ ...s, otpEmail: email, showOTPInput: true }));
      } catch(e) { alert(`Backend offline at ${location.host}.`); }
    }

    // ── Step 2: Verify OTP → JWT → Connect WebSocket ──────────────────────────
    async function verifyOTPAndLogin() {
      const code = document.getElementById('otpCode')?.value?.trim();
      if (!code || code.length < 4) { alert('Enter the OTP sent to your email.'); return; }
      try {
        const res = await fetch('/api/v1/auth/otp/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: state.otpEmail, code })
        });
        if (!res.ok) { alert('Incorrect or expired OTP. Try again.'); return; }
        const data = await res.json();
        await _finishLogin(data, state.otpEmail);
        setState(s => ({ ...s, showOTPInput: false }));
      } catch(e) { console.error('[Login]', e); alert('Login error. Check console.'); }
    }

    // ── WebSocket — Live Stream ────────────────────────────────────────────────
    function connectWebSocket() {
      if (!accessToken) return;
      if (wsConn) wsConn.close();
      wsConn = new WebSocket(`${WS_BASE}/api/v1/ws/dashboard?token=${accessToken}`);
      wsConn.onopen = () => {
        console.log('[WS] ✅ Connected to Pukar live stream');
        setState(s => ({ ...s, apiStatus: 'LIVE' }));
      };
      wsConn.onmessage = (e) => {
        if (e.data === 'pong') return;
        try { handleRealtimeEvent(JSON.parse(e.data)); } catch {}
      };
      wsConn.onclose = () => {
        setState(s => ({ ...s, apiStatus: 'RECONNECTING' }));
        setTimeout(connectWebSocket, 3000); // Auto-reconnect
      };
      // Heartbeat — prevents proxy/nginx from closing idle connections
      setInterval(() => { if (wsConn?.readyState === 1) wsConn.send('ping'); }, 25000);
    }

    function handleRealtimeEvent({ event_type, payload }) {
      if (event_type === 'NEW_SOS') {
        const priority = payload.priority || 50;
        setState(s => ({
          ...s,
          incidents: [{
            id:       payload.incident_id || `inc-${Date.now()}`,
            code:     (payload.sos_id || payload.incident_id || '').slice(0, 8).toUpperCase(),
            title:    `Priority ${priority} — ${payload.category || 'Emergency'}`,
            category: priority >= 75 ? 'BUILDING_COLLAPSE' : 'DISASTER_ALERT',
            severity: priority >= 75 ? 'CRITICAL' : priority >= 35 ? 'WARN' : 'INFO',
            status:   'DISPATCHING',
            location: { sector: `${payload.lat?.toFixed(4)}, ${payload.lon?.toFixed(4)}` },
            createdAt: new Date().toLocaleTimeString(),
            // v2 ML Intelligence fields — drive badge display
            needsHumanReview:     payload.needs_human_review,
            injectionSuspected:   payload.injection_suspected,
            falseAlarmLikelihood: payload.false_alarm_likelihood,
            escalationSignal:     payload.escalation_signal,
            aiScoreV2: { priority, briefing: { headline: `Priority ${priority} SOS — AI triage complete` } }
          }, ...s.incidents.slice(0, 49)]
        }));
      }
      if (event_type === 'DISPATCH_UPDATED') {
        setState(s => ({
          ...s,
          incidents: s.incidents.map(i =>
            i.id === payload.incident_id ? { ...i, status: 'DISPATCHED' } : i
          )
        }));
      }
    }

    // ── Sync Incidents from Backend ────────────────────────────────────────────
    async function syncBackendData() {
      if (!accessToken) return;
      try {
        const res = await fetch('/api/v1/incidents/officer/incidents', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (res.status === 401) { await attemptTokenRefresh(); return; }
        if (!res.ok) return;
        const data = await res.json();
        const mapped = data.map(inc => ({
          id:       inc.incident_id,
          code:     (inc.sos_id || inc.incident_id).slice(0, 8).toUpperCase(),
          title:    inc.ai_summary || 'Emergency Signal',
          category: inc.severity === 'CRITICAL' ? 'BUILDING_COLLAPSE' : 'DISASTER_ALERT',
          severity: inc.severity,
          status:   inc.status,
          location: { sector: `Lat: ${inc.lat?.toFixed(4)}, Lon: ${inc.lon?.toFixed(4)}` },
          createdAt: new Date(inc.received_at || Date.now()).toLocaleTimeString(),
          needsHumanReview:     inc.needs_human_review,
          injectionSuspected:   inc.injection_suspected,
          escalationSignal:     inc.escalation_signal,
          falseAlarmLikelihood: inc.false_alarm_likelihood,
          aiScoreV2: { priority: inc.priority, briefing: { headline: inc.ai_summary || 'Emergency signal' } }
        }));
        setState(s => ({ ...s, incidents: mapped, apiStatus: 'LIVE', lastSyncTime: new Date().toLocaleTimeString() }));
      } catch(e) { console.warn('[Sync]', e.message); }
    }

    // ── Real Dispatch ──────────────────────────────────────────────────────────
    async function handleDispatch(incId, resType) {
      if (!accessToken) { alert('Not authenticated.'); return; }
      const targetInc = state.incidents.find(i => i.id === incId) || state.incidents[0];
      try {
        const res = await fetch(`/api/v1/incidents/${incId}/dispatch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
          body: JSON.stringify({ unit_name: resType || 'RESCUE_TEAM' })
        });
        if (res.status === 403) {
          alert('Dispatch requires COMMANDER or higher role.');
          return;
        }
        if (res.ok) {
          const newAudit = {
            id: `aud-${Date.now()}`, timestamp: new Date().toLocaleTimeString(),
            userName: state.officerName, role: state.roleDisplay,
            action: 'DISPATCH_RESOURCE', resourceName: `${resType || 'RESCUE_TEAM'} → ${targetInc?.code || incId}`,
            result: 'SUCCESS'
          };
          setState(s => ({ ...s, auditEvents: [newAudit, ...s.auditEvents], selectedIncidentId: null }));
          // WS will push DISPATCH_UPDATED — no manual incident status update needed
        }
      } catch(e) { console.error('[Dispatch]', e); }
    }

    // ── SOS Ingest via Portal Test Modal ──────────────────────────────────────
    async function handleFeedSosPacket() {
      if (!accessToken) { alert('Please login first.'); return; }
      try {
        const parsed = JSON.parse(state.rawPacketJson);
        const res = await fetch('/api/v1/sos/ingest', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Gateway-Id': 'NODE-GW-PORTAL',
            'Authorization': `Bearer ${accessToken}`
          },
          body: JSON.stringify(parsed)
        });
        if (res.ok) {
          alert('⚡ SOS ingested successfully! Live WS event incoming...');
          setState({ showIngestModal: false });
        } else {
          const err = await res.json().catch(() => ({}));
          alert(`Ingest failed: ${err.detail || res.status}`);
        }
      } catch(e) { alert('Invalid JSON. Check the packet syntax.'); }
    }

    // ── Silent Token Refresh ───────────────────────────────────────────────────
    async function attemptTokenRefresh() {
      if (!refreshToken) { handleLogout(); return; }
      try {
        const res = await fetch('/api/v1/auth/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: refreshToken })
        });
        if (res.ok) {
          const d = await res.json();
          accessToken  = d.access_token;
          refreshToken = d.refresh_token;
        } else { handleLogout(); }
      } catch {}
    }

    // ── Secure Logout (revokes session in DB) ─────────────────────────────────
    async function handleLogout() {
      if (accessToken && sessionId) {
        await fetch('/api/v1/auth/logout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
          body: JSON.stringify({ session_id: sessionId })
        }).catch(() => {});
      }
      accessToken = refreshToken = sessionId = null;
      wsConn?.close(); wsConn = null;
      setState(s => ({ ...s, isAuthenticated: false, apiStatus: 'CONNECTING', incidents: [], authPage: 'signin' }));
    }

    // ── Password Login ─────────────────────────────────────────────────────────
    async function loginWithPassword() {
      const email    = document.getElementById('signinEmail')?.value?.trim();
      const password = document.getElementById('signinPassword')?.value;
      if (!email || !password) { alert('Enter your email and password.'); return; }
      try {
        const res = await fetch('/api/v1/auth/login/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (res.status === 401) { alert('Incorrect email or password.'); return; }
        if (!res.ok) { const e = await res.json().catch(()=>({})); alert(e.detail || 'Login failed.'); return; }
        const data = await res.json();
        await _finishLogin(data, email);
      } catch(e) { alert(`Backend offline at ${location.host}.`); }
    }

    // ── Register New Account ───────────────────────────────────────────────────
    async function registerAccount() {
      const full_name = document.getElementById('regName')?.value?.trim();
      const badge_id  = document.getElementById('regBadge')?.value?.trim();
      const phone     = document.getElementById('regPhone')?.value?.trim() || '';
      const email     = document.getElementById('regEmail')?.value?.trim();
      const password  = document.getElementById('regPassword')?.value;
      const confirm   = document.getElementById('regConfirm')?.value;
      if (!full_name || !badge_id || !email || !password) {
        alert('Please fill in all required fields.'); return;
      }
      if (password !== confirm) { alert('Passwords do not match.'); return; }
      if (password.length < 6)  { alert('Password must be at least 6 characters.'); return; }
      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, badge_id, phone, email, password })
        });
        if (res.status === 409) { alert('An account with this email already exists. Please sign in.'); return; }
        if (!res.ok) { const e = await res.json().catch(()=>({})); alert(e.detail || 'Registration failed.'); return; }
        const data = await res.json();
        await _finishLogin(data, email);
      } catch(e) { alert(`Backend offline at ${location.host}.`); }
    }

    // ── Shared post-login wiring ───────────────────────────────────────────────
    async function _finishLogin(data, email) {
      accessToken  = data.access_token;
      refreshToken = data.refresh_token;
      sessionId    = data.session_id;
      const roleDisplay = ROLE_DISPLAY[data.role] || data.role;
      setState(s => ({
        ...s,
        isAuthenticated: true,
        role: data.role,
        roleDisplay,
        badge: (sessionId || '').slice(0, 8).toUpperCase(),
        officerName: email,
        showOTPInput: false,
        auditEvents: [
          { id: `aud-${Date.now()}`, timestamp: new Date().toLocaleTimeString(),
            userName: email, role: roleDisplay,
            action: 'SESSION_AUTHENTICATED', resourceName: 'Login successful', result: 'SUCCESS' },
          ...s.auditEvents
        ]
      }));
      connectWebSocket();
      await syncBackendData();
    }

    // Auto-refresh token 10 min before expiry (tokens expire in 60 min)
    setInterval(attemptTokenRefresh, 50 * 60 * 1000);

    // --- HTML Render Component Generators ---
    function renderLoginView() {
      const isSignIn   = state.authPage !== 'register';
      const isOTPMode  = state.loginMethod === 'otp';

      return `
        <div class="min-h-screen dull-grid-pattern text-slate-100 flex items-center justify-center p-4 sm:p-6 relative font-sans overflow-hidden">
          <div class="scan-line"></div>

          <!-- Ambient particles -->
          <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
            <div class="absolute top-[18%] left-[15%] w-3 h-3 rounded-full bg-rose-500/60 shadow-[0_0_12px_#f43f5e] animate-[floatParticle_7s_infinite_ease-in-out]"></div>
            <div class="absolute top-[35%] right-[18%] w-2.5 h-2.5 rounded-full bg-cyan-400/70 shadow-[0_0_10px_#06b6d4] animate-[floatParticle_9s_infinite_ease-in-out_1s]"></div>
            <div class="absolute bottom-[22%] left-[22%] w-3 h-3 rounded-full bg-amber-400/60 shadow-[0_0_12px_#f59e0b] animate-[floatParticle_8s_infinite_ease-in-out_2s]"></div>
            <svg viewBox="0 0 1000 500" class="w-full h-full object-cover opacity-20 stroke-rose-500/30 fill-rose-500/5" stroke-width="1.5">
              <path d="M 120 100 Q 150 70 220 80 T 300 120 T 260 220 T 180 240 T 130 180 Z" />
              <path d="M 460 180 Q 540 180 570 240 T 540 360 T 480 340 T 450 240 Z" />
              <path d="M 570 90 Q 680 70 820 100 T 880 200 T 780 280 T 650 250 T 570 170 Z" />
            </svg>
          </div>

          <!-- Card -->
          <div class="w-full ${isSignIn ? 'max-w-md' : 'max-w-xl'} glass-card rounded-3xl p-7 sm:p-10 space-y-6 relative z-10">

            <!-- Brand -->
            <div class="text-center space-y-2">
              <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-b from-rose-500/20 to-rose-950/40 border border-rose-500/40 flex items-center justify-center text-rose-400 text-3xl shadow-[0_0_20px_rgba(244,63,94,0.3)]">🛡️</div>
              <h1 class="text-4xl sm:text-5xl font-black font-heading tracking-tight">
                <span class="bg-gradient-to-r from-white via-slate-100 to-rose-300 bg-clip-text text-transparent">PUKAAR</span>
              </h1>
              <p class="text-[11px] text-slate-400 font-semibold tracking-widest uppercase">🇮🇳 National Emergency Operations Portal</p>
            </div>

            <!-- Page Tab Toggle -->
            <div class="flex rounded-2xl bg-[#060a14] border border-slate-800 p-1 gap-1">
              <button
                onclick="setState(s => ({ ...s, authPage: 'signin', showOTPInput: false }))"
                class="flex-1 py-2.5 rounded-xl text-xs font-bold tracking-widest uppercase transition-all ${isSignIn ? 'bg-rose-600 text-white shadow-[0_0_15px_rgba(244,63,94,0.4)]' : 'text-slate-500 hover:text-slate-300'}">
                Sign In
              </button>
              <button
                onclick="setState(s => ({ ...s, authPage: 'register' }))"
                class="flex-1 py-2.5 rounded-xl text-xs font-bold tracking-widest uppercase transition-all ${!isSignIn ? 'bg-rose-600 text-white shadow-[0_0_15px_rgba(244,63,94,0.4)]' : 'text-slate-500 hover:text-slate-300'}">
                Create Account
              </button>
            </div>

            ${isSignIn ? `
            <!-- ══════════════ SIGN IN PAGE ══════════════ -->
            <div class="space-y-4">

              <!-- Email -->
              <div class="space-y-1.5">
                <label class="text-slate-400 text-xs font-semibold tracking-widest uppercase">Email Address</label>
                <input id="signinEmail" type="email" placeholder="officer@ndrf.gov.in" autocomplete="email"
                  class="w-full px-4 py-3.5 rounded-xl bg-[#060a14] border border-slate-700/80 text-slate-100 text-sm font-medium focus:outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-500/30 transition-all placeholder:text-slate-600" />
              </div>

              ${!isOTPMode ? `
              <!-- Password mode -->
              <div class="space-y-1.5">
                <label class="text-slate-400 text-xs font-semibold tracking-widest uppercase">Password</label>
                <input id="signinPassword" type="password" placeholder="Enter your password" autocomplete="current-password"
                  class="w-full px-4 py-3.5 rounded-xl bg-[#060a14] border border-slate-700/80 text-slate-100 text-sm font-medium focus:outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-500/30 transition-all placeholder:text-slate-600" />
              </div>

              <button onclick="loginWithPassword()"
                class="w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-400 text-white font-extrabold text-sm tracking-widest uppercase shadow-[0_0_20px_rgba(244,63,94,0.4)] hover:scale-[1.01] active:scale-[0.99] transition-all">
                SIGN IN →
              </button>

              <p class="text-center">
                <button onclick="setState(s => ({ ...s, loginMethod: 'otp', showOTPInput: false }))"

                        <p class="text-xs text-slate-400 mt-1">Real-time geospatial severity mapping and multi-hop telemetry.</p>
                      </div>
                      <span class="px-3 py-1.5 rounded-xl bg-rose-950/60 text-rose-300 border border-rose-500/40 font-bold text-xs">ACTIVE ZONE ALPHA: SECTOR 14</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div class="p-5 rounded-2xl bg-[#0d121f]/90 border border-rose-500/40 space-y-1.5">
                        <span class="text-xs text-rose-400 font-bold">ZONE ALPHA RADIUS</span>
                        <p class="text-3xl font-extrabold text-rose-400">850m</p>
                        <p class="text-xs text-slate-300">Expanded (+240% velocity)</p>
                      </div>
                      <div class="p-5 rounded-2xl bg-[#0d121f]/90 border border-amber-500/40 space-y-1.5">
                        <span class="text-xs text-amber-400 font-bold">CORROBORATION RATE</span>
                        <p class="text-3xl font-extrabold text-amber-400">18 / 3min</p>
                        <p class="text-xs text-slate-300">Spike velocity confirmed</p>
                      </div>
                      <div class="p-5 rounded-2xl bg-[#0d121f]/90 border border-slate-800 space-y-1.5">
                        <span class="text-xs text-cyan-400 font-bold">PACKET DELIVERY</span>
                        <p class="text-3xl font-extrabold text-cyan-300">99.4%</p>
                        <p class="text-xs text-slate-400">Mesh Hop P1→P5</p>
                      </div>
                      <div class="p-5 rounded-2xl bg-[#0d121f]/90 border border-slate-800 space-y-1.5">
                        <span class="text-xs text-emerald-400 font-bold">AI CONFIDENCE</span>
                        <p class="text-3xl font-extrabold text-emerald-400">94.0%</p>
                        <p class="text-xs text-slate-400">Groq NLP Extraction</p>
                      </div>
                    </div>
                  </div>
                </div>
              ` : ''}

              ${state.activeTab === 'admins' ? `
                <div class="space-y-6 text-xs">
                  <div class="flex items-center justify-between">
                    <div>
                      <h3 class="text-lg font-bold text-slate-100 font-heading">SESSION &amp; ACCESS CONTROL</h3>
                      <p class="text-xs text-slate-400">Your authenticated session details and role permissions.</p>
                    </div>
                    <span class="px-3 py-1.5 rounded-xl bg-cyan-950/60 text-cyan-300 border border-cyan-500/40 font-mono font-bold">
                      LIVE SESSION
                    </span>
                  </div>

                  <!-- Session Info Card -->
                  <div class="p-6 rounded-2xl bg-[#0d121f] border border-slate-800 space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
                      <div class="space-y-1">
                        <p class="text-xs text-slate-500 font-mono uppercase tracking-wide">Authenticated As</p>
                        <p class="text-slate-100 font-semibold">${state.officerName}</p>
                      </div>
                      <div class="space-y-1">
                        <p class="text-xs text-slate-500 font-mono uppercase tracking-wide">Backend Role</p>
                        <span class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold ${state.role === 'SUPER_ADMIN' ? 'bg-purple-950 text-purple-300 border border-purple-500/40' : state.role === 'COMMANDER' ? 'bg-rose-950 text-rose-300 border border-rose-500/40' : 'bg-slate-800 text-slate-300 border border-slate-700'}">
                          ${state.role}
                        </span>
                      </div>
                      <div class="space-y-1">
                        <p class="text-xs text-slate-500 font-mono uppercase tracking-wide">Session ID</p>
                        <p class="text-cyan-400 font-mono font-bold">${state.badge}</p>
                      </div>
                    </div>
                    <div class="pt-2 border-t border-slate-800 text-xs text-slate-500">
                      👥 To manage users &amp; roles, use <span class="text-cyan-400 font-mono">GET /api/v1/users</span> or the Swagger UI at
                      <a href="/docs" target="_blank" class="text-rose-400 hover:underline font-mono">/docs</a>
                    </div>
                  </div>
                </div>
              ` : ''}

              ${state.activeTab === 'audit' ? `
                <div class="space-y-4 text-xs">
                  <h3 class="text-lg font-bold text-slate-100 font-heading">ENTERPRISE AUDIT EVENT LOG STREAM</h3>
                  <div class="p-4 rounded-2xl bg-[#0d121f] border border-slate-800 overflow-x-auto">
                    <table class="w-full text-left">
                      <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs">
                          <th class="py-3 px-4">Time</th>
                          <th class="py-3 px-4">User</th>
                          <th class="py-3 px-4">Role</th>
                          <th class="py-3 px-4">Action</th>
                          <th class="py-3 px-4">Result</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-800/60">
                        ${state.auditEvents.map(evt => `
                          <tr>
                            <td class="py-3 px-4 text-cyan-400 font-mono">${evt.timestamp}</td>
                            <td class="py-3 px-4">${evt.userName}</td>
                            <td class="py-3 px-4 text-amber-300 font-mono">${evt.role}</td>
                            <td class="py-3 px-4 font-semibold text-slate-200">${evt.action}</td>
                            <td class="py-3 px-4 text-emerald-400 font-mono">${evt.result}</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              ` : ''}
            </main>
          </div>

          <!-- Ingest Modal -->
          ${state.showIngestModal ? `
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-[#0d121f] border border-slate-700 rounded-3xl w-full max-w-lg p-6 space-y-4 shadow-2xl text-xs">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 class="text-sm font-bold text-slate-100">⚡ FEED LIVE SOS PACKET TO BACKEND</h3>
                  <button onclick="setState({ showIngestModal: false })" class="text-slate-400 hover:text-white">✕</button>
                </div>
                <p class="text-slate-300">Post raw emergency JSON packet to backend endpoint:</p>
                <textarea id="rawPacketInput" rows="8" class="w-full p-4 rounded-xl bg-[#060911] border border-slate-800 text-cyan-300 font-mono text-xs focus:outline-none">${state.rawPacketJson}</textarea>
                <div class="flex justify-end gap-2 pt-2">
                  <button onclick="setState({ showIngestModal: false })" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold">Cancel</button>
                  <button onclick="handleFeedSosPacket()" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold shadow-sm">Ingest Packet →</button>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- Incident Workspace Modal -->
          ${selectedInc ? `
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-[#0d121f] border border-slate-700 rounded-3xl w-full max-w-3xl max-h-[92vh] overflow-y-auto p-8 space-y-6 shadow-2xl">
                <div class="flex items-start justify-between border-b border-slate-800 pb-4">
                  <div>
                    <span class="text-xs font-mono font-bold text-rose-400 bg-rose-500/10 px-2.5 py-1 rounded-lg border border-rose-500/20">${selectedInc.code}</span>
                    <h2 class="text-xl font-bold text-slate-100 mt-2 font-heading">${selectedInc.title}</h2>
                    <p class="text-xs text-slate-400 mt-0.5">${selectedInc.location?.sector}</p>
                  </div>
                  <button onclick="setState({ selectedIncidentId: null })" class="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div class="p-4 rounded-2xl bg-[#060911] border border-slate-800 space-y-1">
                  <p class="font-mono text-xs font-bold text-amber-400 uppercase">TACTICAL BRIEFING</p>
                  <p class="text-sm font-semibold text-slate-100 leading-relaxed">${selectedInc.aiScoreV2?.briefing?.headline}</p>
                </div>

                <div class="p-5 rounded-2xl bg-[#060911] border border-slate-800 space-y-3 text-xs">
                  <p class="font-bold text-slate-200 text-sm">⚡ AUTOMATED TRIAGE MATRIX</p>
                  <div class="grid grid-cols-5 gap-2 text-center text-xs font-mono">
                    <div class="p-2.5 bg-[#0d121f] rounded-xl border border-slate-800">Regex: <strong class="text-cyan-400">${selectedInc.aiScoreV2?.regexScore || 88}%</strong></div>
                    <div class="p-2.5 bg-[#0d121f] rounded-xl border border-slate-800">NLP: <strong class="text-amber-400">${selectedInc.aiScoreV2?.groqScore || 94}%</strong></div>
                    <div class="p-2.5 bg-[#0d121f] rounded-xl border border-slate-800">Corroboration: <strong class="text-emerald-400">+${selectedInc.aiScoreV2?.corroborationBonus || 8}</strong></div>
                    <div class="p-2.5 bg-[#0d121f] rounded-xl border border-slate-800">Location: <strong class="text-indigo-400">+${selectedInc.aiScoreV2?.locationBonus || 3}</strong></div>
                    <div class="p-2.5 bg-rose-950/40 text-rose-300 rounded-xl border border-rose-500/40 font-bold">Priority: ${selectedInc.aiScoreV2?.priority || 97}</div>
                  </div>
                </div>

                <div class="p-5 rounded-2xl bg-[#060911] border border-slate-800 space-y-3 text-xs">
                  <p class="font-bold text-slate-200 text-sm">📡 MESH PACKET TRANSIT ROUTE (P1 → P5 → SERVER)</p>
                  <div class="flex flex-wrap items-center gap-2 text-xs font-mono">
                    <span class="p-2.5 rounded-xl bg-rose-950/40 text-rose-300 border border-rose-500/30">P1 (Victim)</span>
                    <span class="text-slate-600">→</span>
                    <span class="p-2.5 rounded-xl bg-[#0d121f] text-slate-300 border border-slate-800">P2 (Relay)</span>
                    <span class="text-slate-600">→</span>
                    <span class="p-2.5 rounded-xl bg-[#0d121f] text-slate-300 border border-slate-800">P3 (Relay)</span>
                    <span class="text-slate-600">→</span>
                    <span class="p-2.5 rounded-xl bg-[#0d121f] text-slate-300 border border-slate-800">P4 (Relay)</span>
                    <span class="text-slate-600">→</span>
                    <span class="p-2.5 rounded-xl bg-[#0d121f] text-slate-300 border border-slate-800">P5 (Gateway)</span>
                    <span class="text-slate-600">→</span>
                    <span class="p-2.5 rounded-xl bg-emerald-950/40 text-emerald-300 border border-emerald-500/30">SERVER 🌐</span>
                  </div>
                </div>

                <div class="flex flex-wrap items-center justify-end gap-3 pt-4 border-t border-slate-800">
                  <button onclick="handleDispatch('${selectedInc.id}', 'RESCUE')" class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs shadow-sm flex items-center gap-2">
                    <span>🚒</span>
                    <span>Dispatch Rescue</span>
                  </button>
                  <button onclick="handleDispatch('${selectedInc.id}', 'AMBULANCE')" class="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-semibold text-xs shadow-sm flex items-center gap-2">
                    <span>🚑</span>
                    <span>Dispatch Ambulance</span>
                  </button>
                  <button onclick="setState({ selectedIncidentId: null })" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Close</button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderApp() {
      const container = document.getElementById('app');
      if (!container) return;
      if (!state.isAuthenticated) {
        container.innerHTML = renderLoginView();
      } else {
        container.innerHTML = renderDashboardView();
      }
    }

    // Initial render on page load
    document.addEventListener('DOMContentLoaded', renderApp);
    renderApp();
  </script>
</body>
</html>
